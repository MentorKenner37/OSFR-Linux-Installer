name: Create current version tag

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-version-tag.yml"

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create tag and dispatch publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Immutable tag $TAG already exists; it will not be moved."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA"
            echo "Created $TAG at $GITHUB_SHA."
          fi
          gh workflow run publish-release.yml --ref main -f tag="$TAG"
          echo "Dispatched the tested publisher for $TAG."
