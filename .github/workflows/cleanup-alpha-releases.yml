name: Clean Alpha Releases

on:
  workflow_run:
    workflows: ["Build Linux Installer"]
    types: [completed]

concurrency:
  group: alpha-release-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  clean-releases:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Keep only current Alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          test -n "$VERSION"
          case "$VERSION" in
            *alpha*|*Alpha*) ;;
            *) echo "Current version is not an Alpha; no Alpha cleanup required."; exit 0 ;;
          esac
          KEEP_TAG="v$VERSION"

          echo "Keeping current Alpha release: $KEEP_TAG"

          gh release edit "$KEEP_TAG" \
            --title "Sanctuary Linux Installer $KEEP_TAG" \
            --notes-file RELEASE_NOTES.md \
            --prerelease

          # Only remove superseded Alpha prereleases. Never delete stable/beta/other release tags.
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true) | .tagName' | while read -r TAG; do
            [ -n "$TAG" ] || continue
            if [ "$TAG" = "$KEEP_TAG" ]; then
              continue
            fi
            case "$TAG" in
              *alpha*|*Alpha*)
                echo "Removing superseded Alpha release and tag: $TAG"
                gh release delete "$TAG" --cleanup-tag --yes
                ;;
              *)
                echo "Leaving non-Alpha prerelease untouched: $TAG"
                ;;
            esac
          done

          echo "Alpha release cleanup complete."
