name: Run unit and smoke tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: OSFR-Launcher/src/global.json

      - name: Restore unit tests
        run: dotnet restore tests/Installer.UnitTests/Installer.UnitTests.csproj

      - name: Run xUnit suite
        run: dotnet test tests/Installer.UnitTests/Installer.UnitTests.csproj -c Release --no-restore --verbosity normal

      - name: Patch launcher demo compile guard and live diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/LauncherDemo/MainWindow.axaml.cs')
          text = path.read_text()

          old = 'if (response.Content.Headers.ContentLength is > maxBytes)'
          new = 'if (response.Content.Headers.ContentLength is long contentLength && contentLength > maxBytes)'
          if old not in text:
              raise SystemExit('Expected launcher compile guard was not found')
          text = text.replace(old, new, 1)

          old = '                UseShellExecute = false\n'
          new = '                UseShellExecute = false,\n                RedirectStandardOutput = true,\n                RedirectStandardError = true\n'
          if old not in text:
              raise SystemExit('Expected ProcessStartInfo shell setting was not found')
          text = text.replace(old, new, 1)

          old = '        process.StartInfo.Environment["PROTON_LOG"] = "0";\n'
          new = '        process.StartInfo.Environment["PROTON_LOG"] = "1";\n'
          if old not in text:
              raise SystemExit('Expected PROTON_LOG setting was not found')
          text = text.replace(old, new, 1)

          old = '''        process.Exited += (_, _) => Dispatcher.UIThread.Post(() =>\n        {\n            process.Dispose();\n            if (ReferenceEquals(_gameProcess, process))\n                _gameProcess = null;\n            LaunchButton.IsEnabled = _serverManifest is not null;\n            LaunchStatusText.Text = "Free Realms exited.";\n            LaunchStatusText.Foreground = Muted;\n        });\n'''
          new = '''        var logDirectory = Path.Combine(\n            Environment.GetFolderPath(Environment.SpecialFolder.UserProfile),\n            ".local", "share", "OSFR-Linux", "Logs");\n        Directory.CreateDirectory(logDirectory);\n        var stdoutLogPath = Path.Combine(logDirectory, "launcher-demo-proton-stdout.log");\n        var stderrLogPath = Path.Combine(logDirectory, "launcher-demo-proton-stderr.log");\n        var launchLogPath = Path.Combine(logDirectory, "launcher-demo-launch.log");\n\n        File.WriteAllText(stdoutLogPath, $"=== Sanctuary Launcher Demo STDOUT {DateTimeOffset.Now:O} ==={Environment.NewLine}");\n        File.WriteAllText(stderrLogPath, $"=== Sanctuary Launcher Demo STDERR {DateTimeOffset.Now:O} ==={Environment.NewLine}");\n\n        var safeArguments = $"run \\\"FreeRealms.exe\\\" {string.Join(' ', tokens.Select(token => token.StartsWith(\"SessionId=\", StringComparison.Ordinal) ? \"SessionId=<redacted>\" : token))}";\n        File.WriteAllText(launchLogPath,\n            $"Timestamp: {DateTimeOffset.Now:O}{Environment.NewLine}" +\n            $"Server: {manifest.LoginServer}{Environment.NewLine}" +\n            $"Proton: {protonPath}{Environment.NewLine}" +\n            $"Steam root: {steamRoot}{Environment.NewLine}" +\n            $"Prefix: {prefixPath}{Environment.NewLine}" +\n            $"Working directory: {clientDirectory}{Environment.NewLine}" +\n            $"Graphics backend: {backend}{Environment.NewLine}" +\n            $"Display mode: {displayMode}{Environment.NewLine}" +\n            $"PROTON_USE_WINED3D: {process.StartInfo.Environment[\"PROTON_USE_WINED3D\"]}{Environment.NewLine}" +\n            $"Command: {protonPath} {safeArguments}{Environment.NewLine}");\n\n        var stdoutWriter = new StreamWriter(new FileStream(stdoutLogPath, FileMode.Append, FileAccess.Write, FileShare.ReadWrite)) { AutoFlush = true };\n        var stderrWriter = new StreamWriter(new FileStream(stderrLogPath, FileMode.Append, FileAccess.Write, FileShare.ReadWrite)) { AutoFlush = true };\n\n        process.OutputDataReceived += (_, args) =>\n        {\n            if (args.Data is not null)\n            {\n                lock (stdoutWriter)\n                    stdoutWriter.WriteLine(args.Data);\n            }\n        };\n        process.ErrorDataReceived += (_, args) =>\n        {\n            if (args.Data is not null)\n            {\n                lock (stderrWriter)\n                    stderrWriter.WriteLine(args.Data);\n            }\n        };\n\n        process.Exited += (_, _) => Dispatcher.UIThread.Post(() =>\n        {\n            try { stdoutWriter.Dispose(); } catch { }\n            try { stderrWriter.Dispose(); } catch { }\n            process.Dispose();\n            if (ReferenceEquals(_gameProcess, process))\n                _gameProcess = null;\n            LaunchButton.IsEnabled = _serverManifest is not null;\n            LaunchStatusText.Text = $"Free Realms exited. Logs: {logDirectory}";\n            LaunchStatusText.Foreground = Muted;\n        });\n'''
          if old not in text:
              raise SystemExit('Expected process exit handler was not found')
          text = text.replace(old, new, 1)

          old = '''        if (!process.Start())\n        {\n            process.Dispose();\n            throw new InvalidOperationException("Proton process could not be started.");\n        }\n\n        _gameProcess = process;\n'''
          new = '''        if (!process.Start())\n        {\n            try { stdoutWriter.Dispose(); } catch { }\n            try { stderrWriter.Dispose(); } catch { }\n            process.Dispose();\n            throw new InvalidOperationException("Proton process could not be started.");\n        }\n\n        process.BeginOutputReadLine();\n        process.BeginErrorReadLine();\n        _gameProcess = process;\n'''
          if old not in text:
              raise SystemExit('Expected process start block was not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Build launcher demo
        run: dotnet build src/LauncherDemo/LauncherDemo.csproj -c Release --verbosity normal

      - name: Publish launcher demo
        run: dotnet publish src/LauncherDemo/LauncherDemo.csproj -c Release -r linux-x64 --self-contained true -o artifacts/Sanctuary-Linux-Launcher-Demo

      - name: Package launcher demo
        run: |
          cd artifacts
          zip -r Sanctuary-Linux-Launcher-Demo-linux-x64.zip Sanctuary-Linux-Launcher-Demo
          sha256sum Sanctuary-Linux-Launcher-Demo-linux-x64.zip > Sanctuary-Linux-Launcher-Demo-linux-x64.sha256

      - name: Upload launcher demo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Sanctuary-Linux-Launcher-Demo-linux-x64
          path: |
            artifacts/Sanctuary-Linux-Launcher-Demo-linux-x64.zip
            artifacts/Sanctuary-Linux-Launcher-Demo-linux-x64.sha256

      - name: Run installer safety smoke tests
        run: dotnet run --project src/Installer.SmokeTests/Installer.SmokeTests.csproj -c Release

      - name: Run launcher path safety smoke tests
        run: dotnet run --project src/Launcher.SmokeTests/Launcher.SmokeTests.csproj -c Release
