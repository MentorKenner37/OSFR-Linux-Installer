name: Publish versioned release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-linux-installer.yml
    with:
      source_ref: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate tag matches project version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          test -n "$VERSION"
          test "$TAG" = "v$VERSION"

      - name: Download tested installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Sanctuary-Linux-Installer-linux-x64
          path: build/installer

      - name: Verify downloaded checksum
        run: cd build/installer && sha256sum -c Sanctuary-Linux-Installer.sha256

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test -f build/installer/Sanctuary-Linux-Installer
          test -f build/installer/Sanctuary-Linux-Installer.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable release $TAG."
            exit 1
          fi
          PRERELEASE_ARGS=()
          case "$TAG" in
            *-*) PRERELEASE_ARGS+=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            build/installer/Sanctuary-Linux-Installer \
            build/installer/Sanctuary-Linux-Installer.sha256 \
            --title "Sanctuary Linux Installer $TAG" \
            --notes-file RELEASE_NOTES.md \
            "${PRERELEASE_ARGS[@]}"
