name: Normalize published releases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-published-releases.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Keep v1.0.0 and v1.0.8 only
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const originalTag = "v1.0.0-alpha.1";
            const stableTag = "v1.0.0";
            const removeTags = ["v1.0.3", "v1.0.4", "v1.0.5", "v1.0.6", "v1.0.7"];

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            });
            const originalRelease = releases.find(release => release.tag_name === originalTag);
            if (!originalRelease) {
              core.setFailed(`Original release ${originalTag} was not found.`);
              return;
            }

            let originalRef;
            try {
              originalRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${originalTag}`
              });
            } catch (error) {
              core.setFailed(`Original tag ${originalTag} was not found: ${error.message}`);
              return;
            }

            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${stableTag}`,
                sha: originalRef.data.object.sha
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: originalRelease.id,
              tag_name: stableTag,
              name: "Sanctuary Linux Installer v1.0.0"
            });

            try {
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${originalTag}`
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            for (const tag of removeTags) {
              const release = releases.find(item => item.tag_name === tag);
              if (release) {
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: release.id
                });
              }
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            core.info("Kept only v1.0.0 and v1.0.8 published releases.");
