name: Build Linux Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: OSFR-Launcher/src/global.json

      - name: Check NuGet dependencies for known vulnerabilities
        run: |
          set -euo pipefail
          dotnet list src/Installer/Installer.csproj package --vulnerable --include-transitive --format json > /tmp/installer-vulnerabilities.json
          dotnet list OSFR-Launcher/src/Launcher/Launcher.csproj package --vulnerable --include-transitive --format json > /tmp/launcher-vulnerabilities.json
          python3 - <<'PY'
          import json
          import sys

          files = [
              "/tmp/installer-vulnerabilities.json",
              "/tmp/launcher-vulnerabilities.json",
          ]
          findings = []

          def walk(value, source):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key.lower() == "vulnerabilities" and isinstance(child, list) and child:
                          findings.append((source, child))
                      walk(child, source)
              elif isinstance(value, list):
                  for child in value:
                      walk(child, source)

          for path in files:
              with open(path, encoding="utf-8-sig") as handle:
                  walk(json.load(handle), path)

          if findings:
              for source, items in findings:
                  print(f"Known vulnerable NuGet dependencies reported in {source}:")
                  print(json.dumps(items, indent=2))
              sys.exit(1)

          print("No known vulnerable NuGet dependencies reported.")
          PY

      - name: Run installer safety smoke tests
        run: |
          set -euo pipefail
          dotnet run --project src/Installer.SmokeTests/Installer.SmokeTests.csproj -c Release

      - name: Validate generated desktop entry
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate "$HOME/.local/share/applications/OSFR-Linux.desktop"

      - name: Run launcher path safety smoke tests
        run: |
          set -euo pipefail
          dotnet run --project src/Launcher.SmokeTests/Launcher.SmokeTests.csproj -c Release

      - name: Publish patched OSFR Launcher
        run: |
          set -euo pipefail
          rm -rf build/launcher
          dotnet publish OSFR-Launcher/src/Launcher/Launcher.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o build/launcher

          test -f build/launcher/Launcher
          mv build/launcher/Launcher build/launcher/OSFRLauncher
          chmod +x build/launcher/OSFRLauncher

          if [ ! -f build/launcher/libSkiaSharp.so ]; then
            SKIA="$(find build/launcher -type f -path '*/linux-x64/native/libSkiaSharp.so' -print -quit)"
            test -n "$SKIA"
            cp "$SKIA" build/launcher/libSkiaSharp.so
          fi

      - name: Embed launcher payload and validate Sanctuary icon
        run: |
          set -euo pipefail
          mkdir -p src/Installer/Resources
          (cd build/launcher && zip -qr ../../src/Installer/Resources/launcher-linux-x64.zip .)
          test -f src/Installer/Assets/osfr-icon.png
          file src/Installer/Assets/osfr-icon.png | grep -q 'PNG image data'

      - name: Publish self-contained C# installer
        run: |
          set -euo pipefail
          rm -rf build/installer
          dotnet publish src/Installer/Installer.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o build/installer

          test -f build/installer/Installer
          mv build/installer/Installer build/installer/Sanctuary-Linux-Installer
          chmod +x build/installer/Sanctuary-Linux-Installer

      - name: Smoke test packaged installer
        run: |
          set -euo pipefail
          build/installer/Sanctuary-Linux-Installer --diagnose | tee /tmp/sanctuary-diagnose.txt
          build/installer/Sanctuary-Linux-Installer --dry-run | tee /tmp/sanctuary-dry-run.txt
          grep -q "Sanctuary Linux Installer diagnostics" /tmp/sanctuary-diagnose.txt
          grep -q "no files will be changed" /tmp/sanctuary-dry-run.txt
          grep -q "$HOME/.local/state/OSFR-Linux/installer.log" /tmp/sanctuary-diagnose.txt
          test ! -e "$HOME/.local/share/OSFR-Linux"

      - name: Generate and verify SHA-256 checksum
        run: |
          set -euo pipefail
          cd build/installer
          sha256sum Sanctuary-Linux-Installer > Sanctuary-Linux-Installer.sha256
          sha256sum -c Sanctuary-Linux-Installer.sha256

      - name: Upload verified installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sanctuary-Linux-Installer-linux-x64
          path: |
            build/installer/Sanctuary-Linux-Installer
            build/installer/Sanctuary-Linux-Installer.sha256
          if-no-files-found: error

  publish-prerelease:
    needs: build-linux-x64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Download tested installer artifacts
        uses: actions/download-artifact@v8
        with:
          name: Sanctuary-Linux-Installer-linux-x64
          path: build/installer

      - name: Verify downloaded checksum
        run: |
          set -euo pipefail
          cd build/installer
          sha256sum -c Sanctuary-Linux-Installer.sha256

      - name: Publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          test -f build/installer/Sanctuary-Linux-Installer
          test -f build/installer/Sanctuary-Linux-Installer.sha256

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing its title and notes."
            gh release edit "$TAG" \
              --title "Sanctuary Linux Installer $TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Sanctuary Linux Installer $TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi

          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" \
              build/installer/Sanctuary-Linux-Installer \
              build/installer/Sanctuary-Linux-Installer.sha256 \
              --clobber; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Failed to upload verified release assets after $attempt attempts."
              exit 1
            fi
            sleep $((attempt * 2))
          done

          if [ "$VERSION" = "0.2.10-alpha" ]; then
            for OLD_TAG in v0.1.0-alpha v0.2.0-alpha v0.2.1-alpha v0.2.2-alpha v0.2.3-alpha v0.2.4-alpha v0.2.5-alpha v0.2.6-alpha v0.2.7-alpha v0.2.8-alpha v0.2.9-alpha; do
              if gh release view "$OLD_TAG" >/dev/null 2>&1; then
                echo "Removing superseded release $OLD_TAG and its tag."
                gh release delete "$OLD_TAG" --cleanup-tag --yes
              fi
            done
          fi
