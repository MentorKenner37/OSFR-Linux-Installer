name: Build Linux Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: OSFR-Launcher/src/global.json

      - name: Run installer safety smoke tests
        run: |
          set -euo pipefail
          dotnet run --project src/Installer.SmokeTests/Installer.SmokeTests.csproj -c Release

      - name: Run launcher path safety smoke tests
        run: |
          set -euo pipefail
          dotnet run --project src/Launcher.SmokeTests/Launcher.SmokeTests.csproj -c Release

      - name: Publish patched OSFR Launcher
        run: |
          set -euo pipefail
          rm -rf build/launcher
          dotnet publish OSFR-Launcher/src/Launcher/Launcher.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o build/launcher

          test -f build/launcher/Launcher
          mv build/launcher/Launcher build/launcher/OSFRLauncher
          chmod +x build/launcher/OSFRLauncher

          if [ ! -f build/launcher/libSkiaSharp.so ]; then
            SKIA="$(find build/launcher -type f -path '*/linux-x64/native/libSkiaSharp.so' -print -quit)"
            test -n "$SKIA"
            cp "$SKIA" build/launcher/libSkiaSharp.so
          fi

      - name: Embed launcher payload
        run: |
          set -euo pipefail
          mkdir -p src/Installer/Resources
          (cd build/launcher && zip -qr ../../src/Installer/Resources/launcher-linux-x64.zip .)
          cp OSFR-Launcher/assets/icon.png src/Installer/Resources/icon.png

      - name: Publish self-contained C# installer
        run: |
          set -euo pipefail
          rm -rf build/installer
          dotnet publish src/Installer/Installer.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o build/installer

          test -f build/installer/Installer
          mv build/installer/Installer build/installer/OSFR-Linux-Installer
          chmod +x build/installer/OSFR-Linux-Installer

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: OSFR-Linux-Installer-linux-x64
          path: build/installer/OSFR-Linux-Installer
          if-no-files-found: error

  publish-prerelease:
    needs: build-linux-x64
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v6

      - name: Download tested installer artifact
        uses: actions/download-artifact@v8
        with:
          name: OSFR-Linux-Installer-linux-x64
          path: build/installer

      - name: Publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          test -f build/installer/OSFR-Linux-Installer

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
          else
            gh release create "$TAG" \
              build/installer/OSFR-Linux-Installer \
              --target "$GITHUB_SHA" \
              --title "OSFR Linux Installer $TAG" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi

          if [ "$VERSION" = "0.2.1-alpha" ]; then
            for OLD_TAG in v0.1.0-alpha v0.2.0-alpha; do
              if gh release view "$OLD_TAG" >/dev/null 2>&1; then
                echo "Removing superseded release $OLD_TAG and its tag."
                gh release delete "$OLD_TAG" --cleanup-tag --yes
              fi
            done
          fi
